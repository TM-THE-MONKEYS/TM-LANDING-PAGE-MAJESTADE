name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  verify-main:
    name: Verify production branch
    runs-on: ubuntu-latest

    steps:
      - name: Ensure deploy runs only from main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Production deploy is allowed only from the main branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm run build

      - name: Production deploy note
        run: |
          echo "Build validated on main."
          echo "Vercel deploys production automatically when main is pushed."
